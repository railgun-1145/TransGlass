name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Resolve version
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart("v")
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (release)
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 5\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppSourceRoot=." "/DMyAppVersion=$env:VERSION" .\TransGlass.iss

      - name: Build portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist\portable | Out-Null
          Copy-Item .\target\release\transglass.exe .\dist\portable\ -Force
          Copy-Item .\transglass.manifest .\dist\portable\ -Force
          $zip = ".\dist\TransGlass_$env:VERSION`_portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path .\dist\portable\* -DestinationPath $zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/TransGlass_${{ env.VERSION }}_Setup.exe
            dist/TransGlass_${{ env.VERSION }}_portable.zip
